# Hello World demo agent - minimal bounded package surface
# Use case: SAFA Hello World candidate validation only

[agent]
agent_id = "hello-world"
max_capacity = 100
rate_limit_per_window = 10
rate_limit_window_secs = 60
# P3: HMAC shared secret for identity binding (min 32 chars).
# DO NOT ship this placeholder to production — the loader refuses to boot
# if the secret still matches a known placeholder pattern.
# Preferred: set environment variable SAFA_AGENT_SECRET_HELLO_WORLD instead,
# which overrides this value and keeps the secret out of version control.
# Generate a real secret with: openssl rand -hex 32
secret = "REPLACE_ME_WITH_OWN_SECRET_OR_USE_SAFA_AGENT_SECRET_ENV"

[agent.domains.fs_read_workspace]
enabled = true
max_magnitude_per_action = 20

[agent.domains.fs_write_workspace]
enabled = true
max_magnitude_per_action = 10

[agent.domains.proc_exec_bounded]
enabled = false
max_magnitude_per_action = 0

[agent.domains.net_out_http]
enabled = false
max_magnitude_per_action = 0
