[meta]
schema_version = "safa-intents-v1"

[intents.list_dir]
binary = "/bin/ls"
args_template = ["-la", "{{0}}"]
validators = ["relative_workspace_path"]
description = "List directory contents"

[intents.read_file_cat]
binary = "/bin/cat"
args_template = ["{{0}}"]
validators = ["relative_workspace_path"]
description = "Read file contents via cat"

[intents.git_status]
binary = "/usr/bin/git"
args_template = ["status"]
validators = []
# Codex adversarial audit: previously `working_dir = "{{workspace_root}}"`
# resolved to the GLOBAL workspace root at config-load time, so every
# agent running `git_status` saw the same shared state — a true
# cross-agent read if the workspace was itself a git repo. The
# placeholder `{{agent_workspace}}` is resolved at call time to
# `workspace_root/{agent_id}`, matching the isolation that
# WorkspacePath already enforces for file_read / file_write.
working_dir = "{{agent_workspace}}"
description = "Git status in the calling agent's workspace"

[intents.git_log]
binary = "/usr/bin/git"
args_template = ["log", "--oneline", "-20"]
validators = []
working_dir = "{{agent_workspace}}"
description = "Recent git history in the calling agent's workspace"
